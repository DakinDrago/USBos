<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Installer USBos</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--border:#2b3442;--text:#e6edf3;--muted:#8b98a9;--accent:#4f8cff;--accent2:#7c5cff;--ok:#3fb950;--err:#f85149;--warn:#d29922}
@media (prefers-color-scheme: light){
  :root{--bg:#f6f8fa;--panel:#ffffff;--panel2:#f1f3f5;--border:#d0d7de;--text:#1f2328;--muted:#57606a}
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{max-width:600px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px;margin:20px}
.langrow{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px}
.langrow button{width:auto;padding:4px 10px;font-size:12px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--muted);font-weight:600}
.langrow button.on{color:#fff;border-color:var(--accent)}
h1{font-size:20px;margin-bottom:6px}
p{color:var(--muted);font-size:13px;margin-bottom:14px}
.meta{color:var(--muted);font-size:12px;margin:-8px 0 14px;font-family:'JetBrains Mono',ui-monospace,monospace}
button{font:inherit;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#fff;font-weight:600;padding:11px 18px;width:100%}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:var(--panel2);border:1px solid var(--border)}
.modes{display:none;flex-direction:column;gap:8px;margin:6px 0 14px}
.modes.show{display:flex}
.mode{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer}
.mode.sel{border-color:var(--accent)}
.mode.disabled{opacity:.45;cursor:not-allowed}
.mode input{width:auto;margin-top:3px;accent-color:var(--accent)}
.mode .t{font-weight:600;font-size:13.5px}
.mode .d{color:var(--muted);font-size:12px}
.mode.danger .t{color:var(--err)}
.danger-check{display:none;gap:8px;align-items:flex-start;background:rgba(248,81,73,.08);border:1px solid var(--err);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.danger-check.show{display:flex}
.danger-check input{width:auto;margin-top:3px;accent-color:var(--err)}
.log{margin-top:16px;background:#0a0d12;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;max-height:220px;overflow-y:auto;overflow-wrap:anywhere;word-break:break-word;color:#9fb0c3}
.log .l{padding:1px 0}
.log .ok{color:var(--ok)}
.log .err{color:var(--err)}
.log .warn{color:var(--warn)}
.done{margin-top:16px;padding:14px;border:1px solid var(--ok);border-radius:10px;color:var(--ok);font-size:13px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="langrow"><button id="lang-fr" type="button">FR</button><button id="lang-en" type="button">EN</button></div>
  <h1 id="t-title">Installer USBos</h1>
  <p id="t-intro"></p>
  <div class="meta" id="meta"></div>
  <button id="go"></button>
  <button id="reset-loc" type="button" class="ghost" style="display:none;margin-top:8px"></button>
  <div class="modes" id="modes">
    <label class="mode danger" id="mode-zero-lbl">
      <input type="radio" name="mode" value="zero">
      <span><span class="t" id="t-zero-t"></span><br><span class="d" id="t-zero-d"></span></span>
    </label>
    <label class="mode" id="mode-full-lbl">
      <input type="radio" name="mode" value="full" checked>
      <span><span class="t" id="t-full-t"></span><br><span class="d" id="t-full-d"></span></span>
    </label>
    <label class="mode" id="mode-diff-lbl">
      <input type="radio" name="mode" value="diff">
      <span><span class="t" id="t-diff-t"></span><br><span class="d" id="t-diff-d"></span></span>
    </label>
  </div>
  <label class="danger-check" id="danger-check"><input type="checkbox" id="danger-ok"><span id="t-danger"></span></label>
  <button id="apply" style="display:none"></button>
  <div class="log" id="log" role="status" aria-live="polite"></div>
  <div class="done" id="done" role="status" aria-live="polite"></div>
  <p style="text-align:center;margin:14px 0 0"><a id="t-guide-link" href="https://github.com/DakinDrago/USBos" target="_blank" rel="noopener noreferrer" style="color:var(--muted);font-size:12px;text-decoration:underline"></a></p>
</div>

    metaEl.textContent = s('meta')(pm.kernelVersion, pm.builtAt || '?', (pm.treeHash || '').slice(0, 12));
  } else {
    metaEl.style.display = 'none'; // vieux payload sans meta : rien à afficher
  }
  goBtn.textContent = s('go');
  resetBtn.textContent = s('reset');
  document.getElementById('t-guide-link').textContent = s('guideLink');
  document.getElementById('t-zero-t').textContent = s('zeroT');
  document.getElementById('t-zero-d').innerHTML = s('zeroD');
  document.getElementById('t-full-t').textContent = s('fullT');
  document.getElementById('t-full-d').innerHTML = s('fullD');
  document.getElementById('t-diff-t').textContent = s('diffT');
  document.getElementById('t-diff-d').innerHTML = s('diffD');
  document.getElementById('t-danger').innerHTML = s('danger');
  doneEl.innerHTML = s('done');
  document.getElementById('lang-fr').classList.toggle('on', lang === 'fr');
  document.getElementById('lang-en').classList.toggle('on', lang === 'en');
  refreshModeUI();
}
document.getElementById('lang-fr').onclick = () => { lang = 'fr'; renderStatic(); };
document.getElementById('lang-en').onclick = () => { lang = 'en'; renderStatic(); };
const logEl = document.getElementById('log');
const goBtn = document.getElementById('go');
const resetBtn = document.getElementById('reset-loc');
const applyBtn = document.getElementById('apply');
const doneEl = document.getElementById('done');
const modesEl = document.getElementById('modes');
const dangerCheck = document.getElementById('danger-check');
const dangerOk = document.getElementById('danger-ok');
let pickedParent = null;
let installExists = false;

function log(msg, cls) {
  const l = document.createElement('div');
  l.className = 'l' + (cls ? ' ' + cls : '');
  l.textContent = msg;
  logEl.append(l);
  logEl.scrollTop = logEl.scrollHeight;
}

/**
 * Décision d'installation PURE (testable sans DOM ni FS) :
 * entries = [relPath], hashes = {relPath: sha256}, mode parmi
 * 'zero' | 'full' | 'diff', local = {relPath: sha256|null si absent}.
 * Retourne [{ relPath, action }] où action vaut :
 * 'write' (dont 'write' en zero = réinstallation),
 * 'added' (diff : absent de la clé), 'updated' (diff : hash différent),
 * 'identical' (diff : inchangé), 'skip-data' (jamais touché),
 * 'skip-config' (config existante gardée).
 */
function planInstall(entries, hashes, mode, local) {
  // Dossiers préservés lus du payload (défaut data+config, cf. make_installer.py
  // PRESERVE_ON_UPDATE) : jamais écrasés en full/diff. La distinction
  // skip-data vs skip-config est gardée (comptes et tip config distincts).
  //
  // config/ : un fichier DÉJÀ présent et MODIFIÉ localement n'est jamais
  // écrasé (préférence utilisateur : thème, langue, fonds, sources de MAJ).
  // En revanche un fichier config IDENTIQUE au payload n'a rien à
  // protéger : le réécrire est sans risque et permet de faire remonter les
  // AJOUTS de configuration d'une nouvelle version, qu'aucune
  // installation existante ne recevait autrement. C'est le compromis qui
  // manquait entre « ne jamais écraser config/ » et « ne jamais livrer les
  // nouveaux fichiers de config ».
  const PRESERVE = new Set(PAYLOAD.preserveOnUpdate || ['data', 'config']);
  const out = [];
  for (const relPath of entries) {
    const topDir = relPath.split('/')[0];
    // Zéro/frais : le dossier vient d'être (re)créé vide, tout s'écrit.
    if (mode === 'zero' || mode === 'fresh') { out.push({ relPath, action: 'write' }); continue; }
    // Les autres modes ne touchent jamais aux données utilisateur.
    if (topDir === 'data') { out.push({ relPath, action: 'skip-data' }); continue; }
    const payloadHash = (hashes[relPath] || '').toLowerCase();
    const localHash = local[relPath];
    const configUnchanged = topDir === 'config' && PRESERVE.has('config')
      && localHash != null && localHash === payloadHash;
    if (mode === 'full') {
      if (configUnchanged) { out.push({ relPath, action: 'identical' }); continue; }
      if (PRESERVE.has('config') && topDir === 'config' && local[relPath] != null) { out.push({ relPath, action: 'skip-config' }); continue; }
      out.push({ relPath, action: topDir === 'config' ? 'added' : 'write' });
      continue;
    }
    // mode 'diff'
    if (local[relPath] == null) { out.push({ relPath, action: 'added' }); continue; }
    if (configUnchanged) { out.push({ relPath, action: 'identical' }); continue; }
    if (local[relPath] !== payloadHash) {
      if (PRESERVE.has('config') && topDir === 'config') { out.push({ relPath, action: 'skip-config' }); continue; }
      out.push({ relPath, action: 'updated' });
      continue;
    }
    out.push({ relPath, action: 'identical' });
  }
  return out;
}

function b64ToBuffer(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

async function sha256Hex(buffer) {
  const digest = await crypto.subtle.digest('SHA-256', buffer);
  return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

async function fileExists(dirHandle, relPath) {
  const parts = relPath.split('/');
  let dir = dirHandle;
  try {
    for (let i = 0; i < parts.length - 1; i++) {
      dir = await dir.getDirectoryHandle(parts[i]);
    }
    await dir.getFileHandle(parts[parts.length - 1]);
    return true;
  } catch {
    return false;
  }
}

async function readLocalHash(dirHandle, relPath) {
  try {
    const parts = relPath.split('/');
    let dir = dirHandle;
    for (let i = 0; i < parts.length - 1; i++) {
      dir = await dir.getDirectoryHandle(parts[i]);
    }
    const fh = await dir.getFileHandle(parts[parts.length - 1]);
    const buf = await (await fh.getFile()).arrayBuffer();
    return sha256Hex(buf);
  } catch {
    return null; // absent ou illisible -> traité comme à installer
  }
}

async function writeFile(dirHandle, relPath, buffer) {
  // Garde anti-traversée : le payload est généré par make_installer.py
  // (chemins relatifs simples), tout chemin suspect est refusé.
  if (relPath.includes('..') || relPath.startsWith('/') || relPath.includes('\\') || relPath.includes(':')) {
    throw new Error('Chemin refusé : ' + relPath);
  }
  const parts = relPath.split('/');
  let dir = dirHandle;
  for (let i = 0; i < parts.length - 1; i++) {
    dir = await dir.getDirectoryHandle(parts[i], { create: true });
  }
  const fh = await dir.getFileHandle(parts[parts.length - 1], { create: true });
  const w = await fh.createWritable();
  try {
    await w.write(buffer);
    await w.close();
  } catch (err) {
    try { await w.abort(); } catch { /* noop */ }
    throw new Error(`${relPath} : ${err.message}`);
  }
}

async function dirExists(parent, name) {
  try { await parent.getDirectoryHandle(name); return true; } catch { return false; }
}

/** Garde du mode zéro : ne rase que ce qui ressemble à une install USBos
 *  (system/kernel.js présent, ou apps/ non-vide). */
async function looksLikeInstall(dirHandle) {
  try {
    const sys = await dirHandle.getDirectoryHandle('system');
    try { await sys.getFileHandle('kernel.js'); return true; } catch { /* noop */ }
  } catch { /* noop */ }
  try {
    const apps = await dirHandle.getDirectoryHandle('apps');
    for await (const _entry of apps.entries()) return true; // au moins 1 entrée
    return false;
  } catch { return false; }
}

function selectedMode() {
  const r = document.querySelector('input[name="mode"]:checked');
  return r ? r.value : 'full';
}

function refreshModeUI() {
  const mode = selectedMode();
  for (const v of ['zero', 'full', 'diff']) {
    document.getElementById(`mode-${v}-lbl`).classList.toggle('sel', v === mode);
  }
  dangerCheck.classList.toggle('show', mode === 'zero' && installExists);
  applyBtn.textContent = mode === 'zero' && installExists
    ? s('applyZero')
    : mode === 'zero' ? s('applyZeroFresh') : mode === 'full' ? s('applyFull') : s('applyDiff');
}
renderStatic();
for (const r of document.querySelectorAll('input[name="mode"]')) {
  r.addEventListener('change', refreshModeUI);
}

goBtn.onclick = async () => {
  if (typeof window.showDirectoryPicker !== 'function') {
    log(s('noFS'), 'err');
    return;
  }
  try {
    pickedParent = await window.showDirectoryPicker({ mode: 'readwrite' });
    dangerOk.checked = false; // reset confirmation destruction à chaque nouvel emplacement
    installExists = await dirExists(pickedParent, 'USBos');
    log(installExists ? s('detected')(pickedParent.name) : s('fresh')(pickedParent.name));
    modesEl.classList.add('show');
    applyBtn.style.display = 'block';
    // Sans install existante, seuls zéro (= neuf) a du sens : full/diff désactivés.
    for (const v of ['full', 'diff']) {
      const radio = document.querySelector(`input[name="mode"][value="${v}"]`);
      radio.disabled = !installExists;
      document.getElementById(`mode-${v}-lbl`).classList.toggle('disabled', !installExists);
    }
    if (!installExists) {
      document.querySelector('input[name="mode"][value="zero"]').checked = true;
    }
    resetBtn.style.display = 'block';
    refreshModeUI();
  } catch (err) {
    log(s('cancelled')(err.message), 'err');
  }
};

resetBtn.onclick = () => {
  // Redonne un état "neutre" sans recharger la page : ré-choisir un
  // emplacement repasse par tout le flux normal (dangerOk, disabled, etc.
  // sont déjà remis à zéro dans goBtn.onclick pour le nouvel emplacement).
  pickedParent = null;
  installExists = false;
  modesEl.classList.remove('show');
  applyBtn.style.display = 'none';
  resetBtn.style.display = 'none';
  dangerCheck.classList.remove('show');
  dangerOk.checked = false;
  doneEl.style.display = 'none';
  logEl.replaceChildren();
};

applyBtn.onclick = async () => {
  if (!pickedParent) { log(s('chooseFirst'), 'err'); return; }
  const mode = installExists ? selectedMode() : 'fresh';
  if (mode === 'zero' && installExists && !dangerOk.checked) {
    log(s('checkDestruction'), 'err');
    return;
  }
  applyBtn.disabled = true;
  goBtn.disabled = true;
  try {
    let usbos;
    if (mode === 'zero' && installExists) {
      const current = await pickedParent.getDirectoryHandle('USBos');
      if (!(await looksLikeInstall(current))) {
        log(s('notInstall'), 'err');
        return;
      }
      log(s('removing'), 'warn');
      await pickedParent.removeEntry('USBos', { recursive: true });
      log(s('removed'));
    }
    usbos = await pickedParent.getDirectoryHandle('USBos', { create: true });
    // Espace d'échange hors USBos (jamais effacé, même en mode zéro).
    await pickedParent.getDirectoryHandle('Partage', { create: true });
    log(s('partageReady'));

    const entries = Object.keys(PAYLOAD.files);
    let plan;
    if (mode === 'fresh' || mode === 'zero') {
      plan = planInstall(entries, PAYLOAD.hashes || {}, installExists ? 'zero' : 'fresh', {});
    } else {
      log(s('analyzing'));
      const local = {};
      let n = 0;
      for (const relPath of entries) {
        local[relPath] = await readLocalHash(usbos, relPath);
        n++;
        if (n % 5 === 0) log(s('analyzed')(n, entries.length));
      }
      plan = planInstall(entries, PAYLOAD.hashes || {}, mode, local);
    }

    let written = 0, failed = 0, added = 0, updated = 0, identical = 0, skippedData = 0, keptConfig = 0;
    const toWrite = plan.filter((p) => ['write', 'added', 'updated'].includes(p.action));
    // Échec mi-parcours : on continue (compteur failed) au lieu de throw au
    // 1er fichier — seul le wipe reste fatal (throw plus haut).
    for (const item of toWrite) {
      try {
        await writeFile(usbos, item.relPath, b64ToBuffer(PAYLOAD.files[item.relPath]));
      } catch (err) {
        failed++;
        log(s('failOn')(item.relPath, err.message), 'err');
        continue;
      }
      written++;
      if (item.action === 'added') added++;
      else if (item.action === 'updated') updated++;
      if ((written + failed) % 5 === 0) log(s('written')(written, toWrite.length));
    }
    for (const item of plan) {
      if (item.action === 'identical') identical++;
      else if (item.action === 'skip-data') skippedData++;
      else if (item.action === 'skip-config') keptConfig++;
    }
    const parts = [];
    if (mode === 'zero' && installExists) parts.push(s('sumZero'));
    else if (mode === 'fresh') parts.push(s('sumFresh'));
    else if (mode === 'full') parts.push(s('sumFull'));
    else parts.push(s('sumDiff'));
    parts.push(s('sumWrote')(written));
    if (failed) parts.push(s('sumFailed')(failed));
    if (added) parts.push(s('sumAdded')(added));
    if (updated) parts.push(s('sumUpdated')(updated));
    if (identical) parts.push(s('sumIdentical')(identical));
    if (keptConfig) parts.push(s('sumConfig')(keptConfig));
    log(s('finished')(parts.join(', ')), failed ? 'err' : 'ok');
    if (failed > 0) log(s('error')(s('sumFailed')(failed)), 'err');
    if (keptConfig) log(s('tip'), 'warn');
    dangerOk.checked = false; // reset confirmation après chaque apply
    doneEl.style.display = 'block';
  } catch (err) {
    log(s('error')(err.message), 'err');
  } finally {
    applyBtn.disabled = false;
    goBtn.disabled = false;
  }
};
</script>
</body>
</html>
